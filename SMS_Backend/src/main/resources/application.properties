# =========================================================
# Application
# =========================================================

spring.application.name=SMS_Backend

# Port on which the Spring Boot backend will run
server.port=8080


# =========================================================
# MySQL Database
# =========================================================

# Database URL is loaded from the local .env file
spring.datasource.url=${DB_URL}

# Database username is loaded from the local .env file
spring.datasource.username=${DB_USERNAME}

# Database password is loaded from the local .env file
spring.datasource.password=${DB_PASSWORD}

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# Hibernate
# =========================================================

# MySQL dialect used by Hibernate
hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Show SQL generated by Hibernate in the console
hibernate.show_sql=true

# Format generated SQL for easier reading
hibernate.format_sql=true

# Do not automatically create/modify database tables.
# Database/schema management should be handled explicitly.
hibernate.hbm2ddl.auto=none

# ============================================================
# JWT
# ============================================================

# JWT secret is supplied through the environment.
jwt.secret=${JWT_SECRET}

# Default expiration: 1 hour = 3600000 milliseconds.
jwt.expiration=${JWT_EXPIRATION:3600000}

# ============================================================
# Initial administrator authentication
# ============================================================

auth.admin.username=${AUTH_ADMIN_USERNAME:admin}
auth.admin.password=${AUTH_ADMIN_PASSWORD}
auth.admin.role=${AUTH_ADMIN_ROLE:ADMIN}